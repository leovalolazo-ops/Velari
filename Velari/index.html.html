<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Velari – Postres</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500&family=Montserrat:wght@300;400&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
body{
margin:0;
font-family:Montserrat;
background:#F8F3ED;
color:#5A504B;
}

/* HEADER */
header{text-align:center;padding:40px}
header img{width:150px}

/* TITULOS */
.section-title{
text-align:center;
font-family:'Playfair Display';
font-size:32px;
margin-bottom:30px;
}

/* FILTROS */
.filters{
display:flex;
justify-content:center;
gap:15px;
flex-wrap:wrap;
margin-bottom:40px;
}
.filter-btn{
padding:10px 22px;
border-radius:25px;
border:1px solid #D6B4A6;
background:white;
cursor:pointer;
}
.filter-btn.active{
background:#2E2E2E;
color:white;
border:none;
}

/* GRID */
.menu{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
gap:25px;
padding:0 40px 120px;
}

/* TARJETA */
.card{
background:white;
padding:25px;
border-radius:18px;
text-align:center;
box-shadow:0 5px 15px rgba(0,0,0,.05);
}
.emoji{font-size:42px}
.price{font-size:22px;margin:15px 0}

/* BOTONES */
.add-btn,.qty-btn,.close-btn{
background:#2E2E2E;
color:white;
border:none;
padding:10px 18px;
border-radius:25px;
cursor:pointer;
}
.close-btn{
background:#999;
margin-top:15px;
width:100%;
}
.qty-control{
display:flex;
justify-content:center;
gap:10px;
align-items:center;
}

/* CARRITO ICONO */
.cart-icon{
position:fixed;
top:20px;
right:20px;
background:#2E2E2E;
color:white;
padding:12px 18px;
border-radius:50px;
cursor:pointer;
display:flex;
gap:8px;
align-items:center;
z-index:1000;
}
#cartCount{
background:#D6B4A6;
color:#2E2E2E;
padding:2px 8px;
border-radius:50%;
}

/* MODALES */
.modal{
display:none;
position:fixed;
top:0;left:0;
width:100%;height:100%;
background:rgba(0,0,0,.4);
justify-content:center;
align-items:center;
z-index:2000;
}
.modal-content{
background:white;
padding:30px;
border-radius:20px;
width:90%;
max-width:420px;
}
.modal-content h3{
font-family:'Playfair Display';
text-align:center;
margin-bottom:15px;
}
.modal-content input{
width:100%;
padding:10px;
margin:8px 0;
border-radius:8px;
border:1px solid #ccc;
}

/* ITEMS CARRITO */
.cart-item{
display:flex;
justify-content:space-between;
align-items:center;
margin:10px 0;
font-size:14px;
}
.cart-qty{
display:flex;
align-items:center;
gap:8px;
}
.total{
margin-top:15px;
font-weight:bold;
text-align:right;
}
</style>
</head>

<body>

<header>
<img src="https://i.ibb.co/20Q6mbqk/Chat-GPT-Image-7-feb-2026-02-33-48.png">
</header>

<div class="cart-icon" onclick="openCart()">🛍️ <span id="cartCount">0</span></div>

<h2 class="section-title">Nuestro Menú</h2>

<div class="filters">
<button class="filter-btn active" onclick="filterMenu('all',this)">Todos</button>
<button class="filter-btn" onclick="filterMenu('galletas',this)">Galletas</button>
<button class="filter-btn" onclick="filterMenu('tortas',this)">Tortas</button>
<button class="filter-btn" onclick="filterMenu('especiales',this)">Especiales</button>
</div>

<div class="menu" id="menu"></div>

<!-- MODAL CARRITO -->
<div class="modal" id="cartModal" onclick="closeOnBg(event)">
<div class="modal-content">
<h3>Tu carrito</h3>
<div id="cartItems"></div>
<div class="total" id="cartTotal"></div>
<button class="add-btn" onclick="openCheckout()">Realizar pedido</button>
<button class="close-btn" onclick="closeCart()">Cerrar</button>
</div>
</div>

<!-- MODAL CHECKOUT -->
<div class="modal" id="checkoutModal" onclick="closeOnBg(event)">
<div class="modal-content">
<h3>Datos del cliente</h3>
<input id="clientName" placeholder="Nombre">
<input id="clientPhone" placeholder="Celular">
<button class="add-btn" onclick="checkout()">Confirmar pedido</button>
<button class="close-btn" onclick="closeCheckout()">Cancelar</button>
</div>
</div>

<script>
const products=[
{cat:"galletas",name:"Galletas ½ docena",price:9,emoji:"🍪"},
{cat:"galletas",name:"Galletas 1 docena",price:18,emoji:"🍪"},
{cat:"tortas",name:"Torta de Chocolate",price:22,emoji:"🎂"},
{cat:"tortas",name:"Torta Tres Leches",price:22,emoji:"🍰"},
{cat:"especiales",name:"Keke de Zanahoria",price:22,emoji:"🥕"},
{cat:"especiales",name:"Cheesecake de Arándanos",price:25,emoji:"🫐"}
];

let cart={},current="all";

function render(){
menu.innerHTML="";
products.forEach(p=>{
if(current!="all" && p.cat!=current) return;
let q=cart[p.name]?.qty||0;
menu.innerHTML+=`
<div class="card">
<div class="emoji">${p.emoji}</div>
<h3>${p.name}</h3>
<div class="price">S/ ${p.price}</div>
${q==0?
`<button class="add-btn" onclick="add('${p.name}',${p.price},'${p.emoji}')">Agregar</button>`:
`<div class="qty-control">
<button class="qty-btn" onclick="remove('${p.name}')">-</button>
<span>${q}</span>
<button class="qty-btn" onclick="add('${p.name}',${p.price},'${p.emoji}')">+</button>
</div>`}
</div>`;
});
updateCartCount();
}

function add(name,price,emoji){
if(!cart[name]) cart[name]={qty:0,price,emoji};
cart[name].qty++;
render();
}

function remove(name){
cart[name].qty--;
if(cart[name].qty<=0) delete cart[name];
render();
}

function updateCartCount(){
let c=0;
for(let i in cart) c+=cart[i].qty;
cartCount.innerText=c;
}

function filterMenu(cat,btn){
current=cat;
document.querySelectorAll(".filter-btn").forEach(b=>b.classList.remove("active"));
btn.classList.add("active");
render();
}

function openCart(){
cartModal.style.display="flex";
renderCart();
}

function closeCart(){
cartModal.style.display="none";
}

function renderCart(){
let html="",total=0;
for(let i in cart){
let item=cart[i];
let sub=item.qty*item.price;
total+=sub;
html+=`
<div class="cart-item">
<span>${item.emoji} ${i}</span>
<div class="cart-qty">
<button class="qty-btn" onclick="cartMinus('${i}')">-</button>
<span>${item.qty}</span>
<button class="qty-btn" onclick="cartPlus('${i}')">+</button>
</div>
<span>S/ ${sub}</span>
</div>`;
}
cartItems.innerHTML=html || "Carrito vacío";
cartTotal.innerText="Total: S/ "+total;
updateCartCount();
}

function cartPlus(name){
cart[name].qty++;
renderCart();
render();
}

function cartMinus(name){
cart[name].qty--;
if(cart[name].qty<=0) delete cart[name];
renderCart();
render();
}

function openCheckout(){
cartModal.style.display="none";
checkoutModal.style.display="flex";
}

function closeCheckout(){
checkoutModal.style.display="none";
}

function closeOnBg(e){
if(e.target.classList.contains("modal")){
e.target.style.display="none";
}
}

function checkout(){
let name=clientName.value;
let phone=clientPhone.value;
if(!name||!phone){alert("Completa tus datos");return;}

const {jsPDF}=window.jspdf;
const pdf=new jsPDF();
let y=20,total=0,order=Math.floor(Math.random()*100000);

pdf.text("VELARI – PEDIDO #"+order,20,y); y+=15;
pdf.text("Cliente: "+name,20,y); y+=10;
pdf.text("Celular: "+phone,20,y); y+=15;

let msg=`Hola, soy ${name}\n📦 Pedido Velari #${order}\n\n`;

for(let i in cart){
let sub=cart[i].qty*cart[i].price;
total+=sub;
pdf.text(`${cart[i].emoji} ${i} x${cart[i].qty} → S/ ${sub}`,20,y);
y+=8;
msg+=`${cart[i].emoji} ${i} x${cart[i].qty} → S/ ${sub}\n`;
}

y+=10;
pdf.text("Total: S/ "+total,20,y);
pdf.save(`Pedido_Velari_${order}.pdf`);

msg+=`\n💰 Total: S/ ${total}\n📞 ${phone}`;
window.open(`https://wa.me/51924227168?text=${encodeURIComponent(msg)}`);

cart={};
render();
checkoutModal.style.display="none";
}

render();
</script>

</body>
</html>
