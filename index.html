<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Velari – Postres</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500&family=Montserrat:wght@300;400&display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:Montserrat;background:#F8F3ED;color:#5A504B;}
header{text-align:center;padding:40px;}
header img{width:200px;} /* Logo más grande */
.section-title{text-align:center;font-family:'Playfair Display';font-size:32px;margin-bottom:30px;}
.filters{display:flex;justify-content:center;gap:15px;flex-wrap:wrap;margin-bottom:40px;}
.filter-btn{padding:10px 22px;border-radius:25px;border:1px solid #D6B4A6;background:white;cursor:pointer;}
.filter-btn.active{background:#2E2E2E;color:white;border:none;}
.menu{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:25px;padding:0 40px 120px;}
.card{background:white;padding:25px;border-radius:18px;text-align:center;box-shadow:0 5px 15px rgba(0,0,0,.05);}
.emoji{font-size:42px;}
.price{font-size:22px;margin:15px 0;}
.add-btn,.qty-btn,.close-btn{background:#2E2E2E;color:white;border:none;padding:10px 18px;border-radius:25px;cursor:pointer;margin:2px;}
.close-btn{background:#999;margin-top:15px;width:100%;}
.qty-control{display:flex;justify-content:center;gap:10px;align-items:center;flex-wrap:wrap;}
.cart-icon{position:fixed;top:20px;right:20px;background:#2E2E2E;color:white;padding:12px 18px;border-radius:50px;cursor:pointer;display:flex;gap:8px;align-items:center;z-index:1000;}
#cartCount{background:#D6B4A6;color:#2E2E2E;padding:2px 8px;border-radius:50%;}
.modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.4);justify-content:center;align-items:center;z-index:2000;}
.modal-content{background:white;padding:30px;border-radius:20px;width:90%;max-width:420px;}
.modal-content h3{text-align:center;margin-bottom:15px;font-family:'Playfair Display';}
.modal-content input{width:100%;padding:10px;margin:8px 0;border-radius:8px;border:1px solid #ccc;}
.cart-item{display:flex;justify-content:space-between;align-items:center;margin:10px 0;font-size:14px;}
.cart-qty{display:flex;align-items:center;gap:8px;}
.total{margin-top:15px;font-weight:bold;text-align:right;}
.enunciado{font-weight:bold;margin-bottom:5px;}
</style>
</head>
<body>

<header>
<img src="https://i.ibb.co/20Q6mbqk/Chat-GPT-Image-7-feb-2026-02-33-48.png" alt="Velari Logo">
</header>

<div class="cart-icon" onclick="openCart()">🛍️ <span id="cartCount">0</span></div>

<h2 class="section-title">Nuestro Menú</h2>

<div class="filters">
<button class="filter-btn active" onclick="filterMenu('all',this)">Todos</button>
<button class="filter-btn" onclick="filterMenu('galletas',this)">Galletas</button>
<button class="filter-btn" onclick="filterMenu('tortas',this)">Tortas</button>
<button class="filter-btn" onclick="filterMenu('especiales',this)">Especiales</button>
<button class="filter-btn" onclick="filterMenu('cheesecakes',this)">Cheesecakes</button>
</div>

<div class="menu" id="menu"></div>

<!-- MODAL CARRITO -->
<div class="modal" id="cartModal" onclick="closeOnBg(event)">
<div class="modal-content">
<h3>Tu carrito</h3>
<div id="cartItems"></div>
<div class="total" id="cartTotal"></div>
<button class="add-btn" onclick="openCheckout()">Realizar pedido</button>
<button class="close-btn" onclick="closeCart()">Cerrar</button>
</div>
</div>

<!-- MODAL CHECKOUT -->
<div class="modal" id="checkoutModal" onclick="closeOnBg(event)">
<div class="modal-content">
<h3>Datos del cliente</h3>
<input id="clientName" placeholder="Nombre">
<input id="clientPhone" placeholder="Celular">
<button class="add-btn" onclick="checkout()">Confirmar pedido</button>
<button class="close-btn" onclick="closeCheckout()">Cancelar</button>
</div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

// Firebase
const firebaseConfig = {
  apiKey: "AIzaSyDONWMpQzLIqrC0zfylyKYHtxT1HadN0-0",
  authDomain: "velari-pedidos-3f4ae.firebaseapp.com",
  projectId: "velari-pedidos-3f4ae",
  storageBucket: "velari-pedidos-3f4ae.firebasestorage.app",
  messagingSenderId: "844880563162",
  appId: "1:844880563162:web:c30bec59443a67ecb88ee3"
};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

async function guardarPedidoFirebase(pedido){
  try { await addDoc(collection(db,"pedidos"),pedido); console.log("🔥 Pedido guardado en Firebase"); }
  catch(e){ console.error("❌ Error Firebase",e);}
}

// Productos
let products=[
  {cat:"galletas",name:"Galletas",price:[9,18],emoji:"🍪",multi:true}, 

  {cat:"tortas",name:"Torta de Chocolate",price:20,emoji:"🎂"},
  {cat:"tortas",name:"Torta Tres Leches",price:20,emoji:"🍰"},
  {cat:"tortas",name:"Carrot Cake",price:20,emoji:"🥕"},

  {cat:"especiales",name:"Brownie",price:23,emoji:"🍫"},
  {cat:"especiales",name:"Alfajor",price:23,emoji:"🍪"},
  {cat:"especiales",name:"Rollos de Canela",price:23,emoji:"🥐"},
  {cat:"especiales",name:"Pionono",price:23,emoji:"🍰"},

  {cat:"cheesecakes",name:"Cheesecake de Maracuyá",price:25,emoji:"🥭"},
  {cat:"cheesecakes",name:"Cheesecake Oreo",price:25,emoji:"🍪"},
  {cat:"cheesecakes",name:"Cheesecake de Fresa",price:25,emoji:"🍓"},
  {cat:"cheesecakes",name:"Cheesecake de Frutos Rojos",price:25,emoji:"🫐"},
  {cat:"cheesecakes",name:"Cheesecake de Arándanos",price:25,emoji:"🫐"},
  {cat:"cheesecakes",name:"Cheesecake de Brownie",price:25,emoji:"🍫"}
];

let cart={}, current="all";

function render(){
  const menu=document.getElementById("menu");
  menu.innerHTML="";
  products.forEach(p=>{
    if(current!="all" && p.cat!=current) return;

    if(p.multi){
      let q0 = cart[p.name+'-0']?.qty||0;
      let q1 = cart[p.name+'-1']?.qty||0;

      menu.innerHTML+=`
      <div class="card">
        <div class="emoji">${p.emoji}</div>
        <h3>${p.name}</h3>
        <div class="qty-control">
          <div>
            <div class="enunciado">½ Docena</div>
            <div>S/ ${p.price[0]}</div>
            ${q0>0?`
              <button class="qty-btn" onclick="remove('${p.name}-0')">-</button>
              <span>${q0}</span>
              <button class="qty-btn" onclick="add('${p.name}-0',${p.price[0]},'${p.emoji}')">+</button>
            `:`<button class="add-btn" onclick="add('${p.name}-0',${p.price[0]},'${p.emoji}')">Agregar</button>`}
          </div>
          <div>
            <div class="enunciado">1 Docena</div>
            <div>S/ ${p.price[1]}</div>
            ${q1>0?`
              <button class="qty-btn" onclick="remove('${p.name}-1')">-</button>
              <span>${q1}</span>
              <button class="qty-btn" onclick="add('${p.name}-1',${p.price[1]},'${p.emoji}')">+</button>
            `:`<button class="add-btn" onclick="add('${p.name}-1',${p.price[1]},'${p.emoji}')">Agregar</button>`}
          </div>
        </div>
      </div>`;
    } else {
      let q = cart[p.name]?.qty||0;
      menu.innerHTML+=`
      <div class="card">
        <div class="emoji">${p.emoji}</div>
        <h3>${p.name}</h3>
        <div class="price">S/ ${p.price}</div>
        ${q==0?`<button class="add-btn" onclick="add('${p.name}',${p.price},'${p.emoji}')">Agregar</button>`:
        `<div class="qty-control">
          <button class="qty-btn" onclick="remove('${p.name}')">-</button>
          <span>${q}</span>
          <button class="qty-btn" onclick="add('${p.name}',${p.price},'${p.emoji}')">+</button>
        </div>`}
      </div>`;
    }
  });
  updateCartCount();
}

function updateCartCount(){ 
  let c=0; 
  for(let i in cart) c+=cart[i].qty; 
  document.getElementById("cartCount").innerText=c; 
}

function renderCart(){
  let html="",total=0;
  for(let i in cart){
    let item=cart[i], sub=item.qty*item.price;
    total+=sub;

    // Mostrar porción correcta en el carrito
    let displayName = i.includes('-0') ? i.replace('-0',' (½ Docena)') :
                      i.includes('-1') ? i.replace('-1',' (1 Docena)') :
                      i;

    html+=`<div class="cart-item">
      <span>${item.emoji} ${displayName}</span>
      <div class="cart-qty">
        <button class="qty-btn" onclick="cartMinus('${i}')">-</button>
        <span>${item.qty}</span>
        <button class="qty-btn" onclick="add('${i}',${item.price},'${item.emoji}')">+</button>
      </div>
      <span>S/ ${sub}</span>
    </div>`;
  }
  document.getElementById("cartItems").innerHTML=html || "Carrito vacío";
  document.getElementById("cartTotal").innerText="Total: S/ "+total;
}

function add(name,price,emoji){ if(!cart[name]) cart[name]={qty:0,price,emoji}; cart[name].qty++; render(); renderCart(); }
function remove(name){ if(!cart[name]) return; cart[name].qty--; if(cart[name].qty<=0) delete cart[name]; render(); renderCart(); }
function cartPlus(name){ add(name, cart[name].price, cart[name].emoji); renderCart(); }
function cartMinus(name){ remove(name); renderCart(); }
function filterMenu(cat,btn){ current=cat; document.querySelectorAll(".filter-btn").forEach(b=>b.classList.remove("active")); btn.classList.add("active"); render(); }
function openCart(){ document.getElementById("cartModal").style.display="flex"; renderCart(); }
function closeCart(){ document.getElementById("cartModal").style.display="none"; }
function openCheckout(){ closeCart(); document.getElementById("checkoutModal").style.display="flex"; }
function closeCheckout(){ document.getElementById("checkoutModal").style.display="none"; }
function closeOnBg(e){ if(e.target.classList.contains("modal")) e.target.style.display="none"; }

function checkout(){
  let name=document.getElementById("clientName").value.trim();
  let phone=document.getElementById("clientPhone").value.trim();
  if(!name||!phone){alert("Completa tus datos");return;}
  let total=0, msg=`Hola, soy ${name}\n📦 Pedido Velari:\n\n`;
  let pedidoFirebase={cliente:name,telefono:phone,total:0,productos:[],fecha:new Date()};
  for(let i in cart){
    let sub=cart[i].qty*cart[i].price; total+=sub;
    let displayName = i.includes('-0') ? i.replace('-0',' (½ Docena)') :
                      i.includes('-1') ? i.replace('-1',' (1 Docena)') :
                      i;
    msg+=`${cart[i].emoji} ${displayName} x${cart[i].qty} → S/ ${sub}\n`;
    pedidoFirebase.productos.push({nombre:displayName,cantidad:cart[i].qty,precio:cart[i].price,emoji:cart[i].emoji,subtotal:sub});
  }
  pedidoFirebase.total=total;
  guardarPedidoFirebase(pedidoFirebase);
  msg+=`\n💰 Total: S/ ${total}\n📞 ${phone}`;
  window.open(`https://wa.me/51924227168?text=${encodeURIComponent(msg)}`);
  cart={}; render(); renderCart(); closeCheckout();
}

// Funciones globales
window.add=add; window.remove=remove; window.cartPlus=cartPlus; window.cartMinus=cartMinus;
window.openCart=openCart; window.closeCart=closeCart; window.openCheckout=openCheckout;
window.closeCheckout=closeCheckout; window.filterMenu=filterMenu; window.checkout=checkout; window.closeOnBg=closeOnBg;

render();
</script>
</body>
</html>
